<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Set up Opportunity Nav</title>
  <style>
    :root { --bg: #f7f7f5; --panel: #fff; --text: #1d1f23; --muted: #6b6f76; --line: #e2e2de; --accent: #3b6fd8; --hot: #c53030;
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15171b; --panel: #1c1f24; --text: #e4e6ea; --muted: #8b9099; --line: #2a2e35; --accent: #7aa2f7; --hot: #f85149; color-scheme: dark; } }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { max-width: 520px; margin: 12vh auto; padding: 0 20px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 500; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
    .check { display: flex; gap: 8px; align-items: flex-start; margin: 16px 0; color: var(--text); font-weight: 400; }
    .check small { display: block; color: var(--muted); }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    #err { color: var(--hot); margin-top: 12px; min-height: 1.5em; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Opportunity Nav</h1>
    <p>Paste the sign-in link from your server.<br />On the server, <code>npm run admin -w @opnav/server -- signin</code> prints one.</p>
    <form id="f">
      <label for="link">Sign-in link</label>
      <input id="link" type="text" autofocus placeholder="http://gg-macstudio:4317/#signin=…" spellcheck="false" />
      <label class="check"><input id="helper" type="checkbox" checked />
        <span>Use this machine's agents<small>Reports their usage and lets jobs run here while the app is open.</small></span></label>
      <button id="go" type="submit">Connect</button>
      <div id="err" role="alert"></div>
    </form>
  </main>
  <script>
    const f = document.getElementById("f"), go = document.getElementById("go"), err = document.getElementById("err");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      go.disabled = true;
      go.textContent = "Connecting…";
      try {
        await window.opnavDesktop.setup(document.getElementById("link").value, document.getElementById("helper").checked);
      } catch (x) {
        err.textContent = String(x.message || x).replace(/^Error invoking remote method '[^']+': (Error: )?/, "");
        go.disabled = false;
        go.textContent = "Connect";
      }
    });
  </script>
</body>
</html>
